<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title th:text="${pageTitle}">课程表单</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><div class="app-page form-page"><nav class="page-nav"><a class="active" href="/dashboard">首页</a></nav>
<section class="hero-card"><div class="hero-content"><div><div class="eyebrow">📘 COURSE FORM</div><h1 class="hero-title" th:text="${pageTitle}">新增课程</h1><p class="hero-desc">填写课程基本信息、授课安排和教室座位布局。</p></div><a class="btn btn-add" href="/course/page/list">返回课程列表</a></div></section>
<section class="panel"><p th:if="${error}" class="error" th:text="${error}"></p><form th:action="@{/course/page/save}" th:object="${course}" method="post"><input type="hidden" th:field="*{courseId}"><div class="form-grid">
<div class="form-group"><label>课程代码</label><input th:field="*{courseCode}" required maxlength="20" placeholder="例如 CS101"></div><div class="form-group"><label>课程名称</label><input th:field="*{courseName}" required maxlength="50" placeholder="例如 Java Web 开发"></div>
<div class="form-group"><label>授课班级</label><input th:field="*{className}" required maxlength="50"></div><div class="form-group"><label>教师 ID</label><input type="number" th:field="*{teacherId}" min="1" required></div>
<div class="form-group"><label>教室名称</label><input th:field="*{classroomName}" required maxlength="50"></div><div class="form-group"><label>排除座位</label><input th:field="*{excludeSeats}" maxlength="200" placeholder="可选，例如 1-1,1-2"></div>
<div class="form-group"><label>座位行数</label><input type="number" th:field="*{layoutRows}" min="1" required></div><div class="form-group"><label>座位列数</label><input type="number" th:field="*{layoutCols}" min="1" required></div>
<div class="form-group"><label>星期（1-7）</label><input type="number" th:field="*{weekday}" min="1" max="7"></div><div class="form-group"><label>教学周</label><div class="inline-inputs"><input type="number" th:field="*{startWeek}" min="1" placeholder="开始周"><span>至</span><input type="number" th:field="*{endWeek}" min="1" placeholder="结束周"></div></div>
</div><div class="btn-row"><button class="btn btn-primary" type="submit">保存课程</button><a class="btn btn-secondary" href="/course/page/list">取消</a></div></form></section></div></body></html>

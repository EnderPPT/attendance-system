<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · 班级考勤公报</title>
    <link rel="stylesheet" href="/css/style.css" th:href="@{/css/style.css}">
</head>
<body>
<div class="auth-page">
    <section class="hero-card">
        <div class="hero-content">
            <div class="eyebrow">№ 001 · Sign In</div>
            <h1 class="hero-title">进入系统</h1>
            <p class="hero-desc">使用学号或工号登录。新建账号的默认密码为 123456。</p>
        </div>
    </section>

    <section class="panel">
        <p th:if="${errorMsg}" th:text="${errorMsg}" class="error"></p>
        <p th:if="${successMsg}" th:text="${successMsg}" class="success"></p>

        <form action="/page/login" method="post">
            <div class="form-grid">
                <div class="form-group full">
                    <label>账号</label>
                    <input type="text" name="username" placeholder="学号或工号" required>
                </div>
                <div class="form-group full">
                    <label>密码</label>
                    <input type="password" name="password" placeholder="登录密码" required>
                </div>
            </div>

            <div class="btn-row">
                <button type="submit" class="btn btn-primary btn-block">登 录</button>
            </div>
        </form>

        <div class="link">
            尚未注册？<a href="/register">前往注册</a>
        </div>
    </section>
</div>
</body>
</html>

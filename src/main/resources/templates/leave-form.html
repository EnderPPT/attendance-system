<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>提交请假</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-shell">
    <th:block th:replace="~{fragments/sidebar :: sidebar('leave-apply')}"></th:block>

    <main class="main">
        <div class="page-head">
            <div>
                <h1 class="page-title">提交请假</h1>
                <p class="page-subtitle">未来三天内的请假申请。提交后可在「我的请假」查看审批状态。</p>
            </div>
            <div class="actions">
                <a class="btn btn-secondary" href="/leave/page/list" th:unless="${isStudent}">请假记录</a>
                <a class="btn btn-secondary" href="/leave/page/my" th:if="${isStudent}">我的请假</a>
            </div>
        </div>

        <div class="panel">
            <p th:if="${error}" class="error" th:text="${error}"></p>

            <form action="/leave/page/apply" method="post" th:object="${request}">
                <div class="form-grid">
                    <div class="form-group">
                        <label>学号 / 用户 ID</label>
                        <input th:if="${isStudent}" type="number" th:field="*{studentId}" th:value="${sessionUserId}" readonly required>
                        <input th:unless="${isStudent}" type="number" th:field="*{studentId}" min="1" required placeholder="非学生身份代提需手动填写">
                        <small th:if="${isStudent}" style="color:var(--muted); font-size:12px; margin-top:6px; display:block;">由当前账号自动锁定。</small>
                    </div>
                    <div class="form-group">
                        <label>请假课程</label>
                        <select th:field="*{courseId}" required>
                            <option value="">— 请选择课程 —</option>
                            <option th:each="course : ${courses}" th:value="${course.courseId}"
                                    th:text="${course.courseCode + '   ' + course.courseName}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>开始时间</label>
                        <input type="datetime-local" th:field="*{startTime}" required>
                    </div>
                    <div class="form-group">
                        <label>结束时间</label>
                        <input type="datetime-local" th:field="*{endTime}" required>
                    </div>
                    <div class="form-group full">
                        <label>请假事由</label>
                        <textarea th:field="*{reason}" required maxlength="500" rows="4" placeholder="请简要说明请假原因"></textarea>
                    </div>
                </div>

                <div class="btn-row">
                    <button class="btn btn-primary" type="submit">提交申请</button>
                    <a class="btn btn-secondary" href="/leave/page/my" th:if="${isStudent}">取消</a>
                    <a class="btn btn-secondary" href="/leave/page/list" th:unless="${isStudent}">取消</a>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>

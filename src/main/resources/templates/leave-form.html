<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>提交请假申请</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><div class="app-page form-page"><nav class="page-nav"><a class="active" href="/dashboard">首页</a></nav>
<section class="hero-card"><div class="hero-content"><div><div class="eyebrow">📝 LEAVE APPLICATION</div><h1 class="hero-title">提交请假申请</h1><p class="hero-desc">选择课程并填写未来三天内的请假时间，提交后可在请假管理中查看审批状态。</p></div><a class="btn btn-add" href="/leave/page/list">查看申请记录</a></div></section>
<section class="panel"><p th:if="${error}" class="error" th:text="${error}"></p><form action="/leave/page/apply" method="post" th:object="${request}"><div class="form-grid">
<div class="form-group"><label>学生用户 ID</label>
<input th:if="${isStudent}" type="number" th:field="*{studentId}" th:value="${sessionUserId}" readonly required>
<input th:unless="${isStudent}" type="number" th:field="*{studentId}" min="1" required placeholder="请输入学生用户 ID">
<small th:if="${isStudent}">学生身份由当前登录账号自动确定。</small>
</div><div class="form-group"><label>请假课程</label><select th:field="*{courseId}" required><option value="">请选择课程</option><option th:each="course : ${courses}" th:value="${course.courseId}" th:text="${course.courseCode + ' · ' + course.courseName + ' · ' + course.className}"></option></select></div>
<div class="form-group"><label>开始时间</label><input type="datetime-local" th:field="*{startTime}" required></div><div class="form-group"><label>结束时间</label><input type="datetime-local" th:field="*{endTime}" required></div>
<div class="form-group full"><label>请假原因</label><textarea th:field="*{reason}" required maxlength="500" rows="5" placeholder="请填写请假原因"></textarea></div></div><div class="btn-row"><button class="btn btn-primary" type="submit">提交申请</button><a class="btn btn-secondary" href="/leave/page/list">取消</a></div></form></section></div></body></html>

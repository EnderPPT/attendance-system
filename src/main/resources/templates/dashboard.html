<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首页 · 考勤管理系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-shell">
    <th:block th:replace="~{fragments/sidebar :: sidebar('dashboard')}"></th:block>

    <main class="main">
        <div class="page-head">
            <div>
                <h1 class="page-title" th:text="${'你好，' + loginUser.realName}">你好</h1>
                <p class="page-subtitle">从左侧菜单或下方快捷入口进入功能。</p>
            </div>
            <div class="stat">
                <strong th:text="${loginUser.role}">ROLE</strong>
                <span>当前角色</span>
            </div>
        </div>

        <div th:if="${errorMsg}" class="error" th:text="${errorMsg}"></div>

        <div class="panel">
            <div class="menu-grid">
                <a th:if="${isManager}" class="menu-card" href="/student/page/list">
                    <span class="menu-title">学生档案</span>
                    <span class="menu-desc">维护学生基础资料。</span>
                </a>
                <a th:if="${isManager}" class="menu-card" href="/course/page/list">
                    <span class="menu-title">课程目录</span>
                    <span class="menu-desc">维护课程与教室座位布局。</span>
                </a>
                <a th:if="${isManager}" class="menu-card" href="/selection/page/list">
                    <span class="menu-title">选课管理</span>
                    <span class="menu-desc">为学生分配课程。</span>
                </a>
                <a th:unless="${isManager}" class="menu-card" href="/selection/page/my">
                    <span class="menu-title">我的课程</span>
                    <span class="menu-desc">已选课程一览。</span>
                </a>
                <a class="menu-card" href="/attendance/page/checkin">
                    <span class="menu-title">考勤打卡</span>
                    <span class="menu-desc">在座位图上提交打卡。</span>
                </a>
                <a th:if="${isManager}" class="menu-card" href="/attendance/page/list">
                    <span class="menu-title">考勤记录</span>
                    <span class="menu-desc">按课程、状态、日期检索。</span>
                </a>
                <a th:unless="${isManager}" class="menu-card" href="/leave/page/apply">
                    <span class="menu-title">提交请假</span>
                    <span class="menu-desc">三天内的请假申请。</span>
                </a>
                <a th:unless="${isManager}" class="menu-card" href="/leave/page/my">
                    <span class="menu-title">我的请假</span>
                    <span class="menu-desc">查看审批状态。</span>
                </a>
                <a th:if="${isManager}" class="menu-card" href="/leave/page/list">
                    <span class="menu-title">请假审批</span>
                    <span class="menu-desc">处理待审批的申请。</span>
                </a>
                <a th:if="${isManager}" class="menu-card" href="/student/page/import">
                    <span class="menu-title">学生导入</span>
                    <span class="menu-desc">从 Excel 批量导入并建账号。</span>
                </a>
                <a th:if="${isManager}" class="menu-card" href="/attendance/page/import">
                    <span class="menu-title">考勤导入</span>
                    <span class="menu-desc">补录历史考勤数据。</span>
                </a>
            </div>
        </div>
    </main>
</div>
</body>
</html>

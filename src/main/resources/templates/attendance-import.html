<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>考勤导入</title>
    <link rel="stylesheet" href="/css/style.css" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-shell">
    <th:block th:replace="~{fragments/sidebar :: sidebar('attendance-import')}"></th:block>

    <main class="main">
        <div class="page-head">
            <div>
                <h1 class="page-title">考勤导入</h1>
                <p class="page-subtitle">表头格式：学号、课程号、打卡时间、状态、座位排数、座位列数。</p>
            </div>
            <div class="actions">
                <a class="btn btn-secondary" href="/attendance/page/list">返回列表</a>
            </div>
        </div>

        <div class="panel">
            <p th:if="${error}" class="error" th:text="${error}"></p>
            <p th:if="${success}" class="success" th:text="${success}"></p>

            <form th:action="@{/attendance/page/import}" method="post" enctype="multipart/form-data">
                <div class="form-grid">
                    <div class="form-group full">
                        <label>选择文件</label>
                        <input type="file" name="file" accept=".xlsx,.xls" required onchange="checkFileSize(this)">
                        <small style="color:var(--muted); font-size:12px; margin-top:6px; display:block;">支持 xlsx / xls，单文件不超过 10MB。</small>
                    </div>
                </div>
                <div class="btn-row" style="align-items:center;">
                    <button type="submit" class="btn btn-primary" onclick="showLoading()">上传并解析</button>
                    <span id="loadingText" style="display:none; color:var(--muted);">正在解析，请稍候…</span>
                </div>
            </form>
        </div>
    </main>
</div>

<script>
    function checkFileSize(input) {
        if (input.files && input.files[0] && input.files[0].size > 10 * 1024 * 1024) {
            alert('文件不能超过 10MB');
            input.value = '';
        }
    }
    function showLoading() {
        const file = document.querySelector('input[type="file"]');
        if (file.value) {
            document.querySelector('button[type="submit"]').style.opacity = '0.6';
            document.getElementById('loadingText').style.display = 'inline-block';
        }
    }
</script>
</body>
</html>

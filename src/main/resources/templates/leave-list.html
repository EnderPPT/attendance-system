<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>请假管理</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><div class="app-page"><nav class="page-nav"><a href="/dashboard">首页</a><a href="/course/page/list">课程管理</a><a href="/attendance/page/checkin">考勤打卡</a><a href="/attendance/page/list">考勤记录</a><a class="active" href="/leave/page/list">请假管理</a></nav>
<section class="hero-card"><div class="hero-content"><div><div class="eyebrow">🗓️ LEAVE MANAGEMENT</div><h1 class="hero-title">请假申请与审批</h1><p class="hero-desc">按学生、课程或状态查询申请，并在同一页面完成审批。</p></div><div class="hero-stat"><strong th:text="${#lists.size(applications)}">0</strong><span>当前显示申请</span></div><a class="btn btn-add" href="/leave/page/apply">＋ 提交请假</a></div></section>
<section class="panel"><p th:if="${success}" class="success" th:text="${success}"></p><p th:if="${error}" class="error" th:text="${error}"></p>
<form class="filter-row" action="/leave/page/list" method="get"><div class="field"><input type="number" name="studentId" placeholder="学生用户 ID" th:value="${studentId}"></div><div class="field"><select name="courseId"><option value="">全部课程</option><option th:each="course : ${courses}" th:value="${course.courseId}" th:text="${course.courseCode + ' · ' + course.courseName}" th:selected="${course.courseId == courseId}"></option></select></div><div class="field"><select name="status"><option value="">全部状态</option><option value="PENDING" th:selected="${status == 'PENDING'}">待审批</option><option value="APPROVED" th:selected="${status == 'APPROVED'}">已通过</option><option value="REJECTED" th:selected="${status == 'REJECTED'}">已驳回</option></select></div><button class="btn btn-primary" type="submit">筛选</button><a class="btn btn-reset" href="/leave/page/list">重置</a></form>
<div class="table-wrap"><table><thead><tr><th>ID</th><th>学生 ID</th><th>课程</th><th>请假时间</th><th>原因</th><th>状态</th><th>审批</th></tr></thead><tbody>
<tr th:if="${#lists.isEmpty(applications)}"><td colspan="7" class="empty">暂无请假申请。</td></tr>
<tr th:each="item : ${applications}"><td th:text="${item.id}"></td><td class="student-id" th:text="${item.studentId}"></td><td><a class="table-link" th:href="@{/course/page/edit/{id}(id=${item.courseId})}" th:text="${courseMap[item.courseId] != null ? courseMap[item.courseId].courseName : '课程 #' + item.courseId}"></a></td><td><span th:text="${item.startTime}"></span><br><span th:text="${item.endTime}"></span></td><td class="reason-cell" th:text="${item.reason}"></td><td><span class="status-badge" th:classappend="${item.status.toLowerCase()}" th:text="${item.status == 'PENDING' ? '待审批' : (item.status == 'APPROVED' ? '已通过' : '已驳回')}"></span></td><td><form th:if="${item.status == 'PENDING'}" class="approval-form" th:action="@{/leave/page/approve/{id}(id=${item.id})}" method="post"><input name="remark" placeholder="审批备注（可选）"><button class="btn btn-edit" name="approved" value="true" type="submit">通过</button><button class="btn btn-delete" name="approved" value="false" type="submit">驳回</button></form><span th:unless="${item.status == 'PENDING'}" th:text="${item.approverRemark != null && !item.approverRemark.isEmpty() ? item.approverRemark : '已完成'}"></span></td></tr>
</tbody></table></div></section></div></body></html>

<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课程目录</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-shell">
    <th:block th:replace="~{fragments/sidebar :: sidebar('courses')}"></th:block>

    <main class="main">
        <div class="page-head">
            <div>
                <h1 class="page-title">课程目录</h1>
                <p class="page-subtitle">课程信息、授课班级与教室座位布局。</p>
            </div>
            <div class="actions">
                <div class="stat" style="margin-right:18px;">
                    <strong th:text="${#lists.size(courses)}">0</strong>
                    <span>当前数量</span>
                </div>
                <a class="btn btn-add" href="/course/page/add">新增课程</a>
            </div>
        </div>

        <div class="panel">
            <p th:if="${success}" class="success" th:text="${success}"></p>
            <p th:if="${error}" class="error" th:text="${error}"></p>

            <form class="filter-row" action="/course/page/list" method="get">
                <div class="field">
                    <span class="search-icon">⌕</span>
                    <input type="number" name="teacherId" placeholder="教师工号" th:value="${teacherId}">
                </div>
                <div class="field">
                    <span class="search-icon">⌕</span>
                    <input type="text" name="className" placeholder="班级名称" th:value="${className}">
                </div>
                <button class="btn btn-primary" type="submit">查询</button>
                <a class="btn btn-reset" href="/course/page/list">重置</a>
            </form>

            <div class="table-wrap">
                <table>
                    <thead>
                    <tr>
                        <th>课程代码</th>
                        <th>课程名称</th>
                        <th>班级</th>
                        <th>教师</th>
                        <th>教室</th>
                        <th>上课时间</th>
                        <th>教学周</th>
                        <th style="width:140px">操作</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(courses)}">
                        <td colspan="8" class="empty">暂无课程。</td>
                    </tr>
                    <tr th:each="course : ${courses}">
                        <td class="student-id" th:text="${course.courseCode}"></td>
                        <td class="name-cell" th:text="${course.courseName}"></td>
                        <td th:text="${course.className}"></td>
                        <td th:text="${course.teacherId}"></td>
                        <td th:text="${course.classroomName + '（' + course.layoutRows + '×' + course.layoutCols + '）'}"></td>
                        <td th:text="${course.weekday != null ? '周' + course.weekday : '-'} + ' ' + ${course.startTime != null ? course.startTime + '-' + course.endTime : '未设置'}"></td>
                        <td th:text="${course.startWeek != null && course.endWeek != null ? '第 ' + course.startWeek + '-' + course.endWeek + ' 周' : '-'}"></td>
                        <td>
                            <div class="actions wrap-actions">
                                <a class="btn btn-edit" th:href="@{/course/page/edit/{id}(id=${course.courseId})}">编辑</a>
                                <form th:action="@{/course/page/delete/{id}(id=${course.courseId})}" method="post"
                                      onsubmit="return confirm('确认删除该课程？');">
                                    <button class="btn btn-delete" type="submit">删除</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改密码</title>
    <link rel="stylesheet" href="/css/style.css" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-shell" th:unless="${firstLogin}">
    <th:block th:replace="~{fragments/sidebar :: sidebar('password')}"></th:block>

    <main class="main">
        <div class="page-head">
            <div>
                <h1 class="page-title">修改密码</h1>
                <p class="page-subtitle">新密码不少于 6 位，保存后系统将自动退出登录。</p>
            </div>
            <div class="actions">
                <a class="btn btn-secondary" href="/dashboard">返回首页</a>
            </div>
        </div>

        <div class="panel" style="max-width:520px;">
            <p th:if="${errorMsg}" th:text="${errorMsg}" class="error"></p>

            <form action="/page/password" method="post">
                <div class="form-grid" style="grid-template-columns:1fr;">
                    <div class="form-group">
                        <label>当前密码</label>
                        <input type="password" name="oldPassword" placeholder="输入当前密码" required>
                    </div>
                    <div class="form-group">
                        <label>新密码</label>
                        <input type="password" name="newPassword" placeholder="不少于 6 位" required minlength="6">
                    </div>
                    <div class="form-group">
                        <label>确认新密码</label>
                        <input type="password" name="confirmPassword" placeholder="再次输入" required minlength="6">
                    </div>
                </div>
                <div class="btn-row">
                    <button type="submit" class="btn btn-primary">保存新密码</button>
                    <a class="btn btn-secondary" href="/dashboard">取消</a>
                </div>
            </form>
        </div>
    </main>
</div>

<!-- 首次登录强制改密：不显示侧边栏，独立全屏 -->
<div class="auth-page" th:if="${firstLogin}">
    <div class="hero-card">
        <div class="hero-content">
            <div>
                <div class="eyebrow">FIRST LOGIN</div>
                <h1 class="hero-title">首次登录，请修改密码</h1>
                <p class="hero-desc">账号的默认密码为 <strong>123456</strong>，需先修改才能使用系统。</p>
            </div>
        </div>
    </div>

    <div class="panel">
        <p th:if="${errorMsg}" th:text="${errorMsg}" class="error"></p>

        <form action="/page/password" method="post">
            <div class="form-grid">
                <div class="form-group full">
                    <label>当前密码 <small>默认 123456</small></label>
                    <input type="password" name="oldPassword" placeholder="123456" required>
                </div>
                <div class="form-group full">
                    <label>新密码</label>
                    <input type="password" name="newPassword" placeholder="不少于 6 位" required minlength="6">
                </div>
                <div class="form-group full">
                    <label>确认新密码</label>
                    <input type="password" name="confirmPassword" placeholder="再次输入" required minlength="6">
                </div>
            </div>
            <div class="btn-row">
                <button type="submit" class="btn btn-primary btn-block">保存新密码</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>

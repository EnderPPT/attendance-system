<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改密码</title>
    <link rel="stylesheet" href="/css/style.css" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-page form-page">
    <nav class="page-nav"><a class="active" href="/dashboard">首页</a></nav>

    <section class="hero-card">
        <div class="hero-content">
            <div>
                <div class="eyebrow">№ 010 · Password</div>
                <h1 class="hero-title" th:text="${firstLogin} ? '首次登录，请修改密码' : '修改登录密码'">修改登录密码</h1>
                <p class="hero-desc" th:if="${firstLogin}">账号的默认密码为 123456，需先修改才能使用系统。</p>
                <p class="hero-desc" th:unless="${firstLogin}">新密码不少于 6 位，提交后系统将自动退出登录。</p>
            </div>
            <a th:unless="${firstLogin}" class="btn btn-secondary" href="/dashboard">返回首页</a>
        </div>
    </section>

    <section class="panel">
        <p th:if="${errorMsg}" th:text="${errorMsg}" class="error"></p>

        <form action="/page/password" method="post">
            <div class="form-grid">
                <div class="form-group full">
                    <label>当前密码 <small th:if="${firstLogin}">默认 123456</small></label>
                    <input type="password" name="oldPassword" placeholder="输入当前密码" required>
                </div>
                <div class="form-group full">
                    <label>新密码</label>
                    <input type="password" name="newPassword" placeholder="不少于 6 位" required minlength="6">
                </div>
                <div class="form-group full">
                    <label>确认新密码</label>
                    <input type="password" name="confirmPassword" placeholder="再次输入" required minlength="6">
                </div>
            </div>

            <div class="btn-row">
                <button type="submit" class="btn btn-primary">保存新密码</button>
                <a th:unless="${firstLogin}" class="btn btn-secondary" href="/dashboard">取消</a>
            </div>
        </form>
    </section>
</div>
</body>
</html>

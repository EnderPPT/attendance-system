<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>选课管理</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><div class="app-page"><nav class="page-nav"><a class="active" href="/dashboard">首页</a></nav>
<section class="hero-card"><div class="hero-content"><div><div class="eyebrow">🎯 COURSE SELECTION</div><h1 class="hero-title">选课管理</h1><p class="hero-desc">选择课程查看已选学生，或为学生分配课程。</p></div></div></section>
<section class="panel">
<p th:if="${success}" class="success" th:text="${success}"></p><p th:if="${error}" class="error" th:text="${error}"></p>
<form class="filter-row" action="/selection/page/list" method="get">
<div class="field"><select name="courseId"><option value="">请选择课程</option><option th:each="course : ${courses}" th:value="${course.courseId}" th:text="${course.courseCode + ' · ' + course.courseName + ' · ' + course.className}" th:selected="${course.courseId == courseId}"></option></select></div>
<button class="btn btn-primary" type="submit">查看名单</button>
<a class="btn btn-reset" href="/selection/page/list">重置</a>
</form>

<div th:if="${selectedCourse != null}">
<h3 th:text="${'课程：' + selectedCourse.courseName + '（' + selectedCourse.className + '）'}"></h3>
<form action="/selection/page/add" method="post" class="filter-row">
<input type="hidden" name="courseId" th:value="${selectedCourse.courseId}">
<div class="field"><input type="number" name="studentId" placeholder="学生用户 ID" required></div>
<button class="btn btn-primary" type="submit">＋ 添加学生选课</button>
</form>

<div class="table-wrap"><table>
<thead><tr><th>用户 ID</th><th>用户名</th><th>姓名</th><th>角色</th><th>操作</th></tr></thead>
<tbody>
<tr th:if="${#lists.isEmpty(students)}"><td colspan="5" class="empty">该课程暂无学生选课。</td></tr>
<tr th:each="s : ${students}">
<td th:text="${s.id}"></td><td th:text="${s.username}"></td><td th:text="${s.realName}"></td><td th:text="${s.role}"></td>
<td><form action="/selection/page/delete" method="post" onsubmit="return confirm('确定退选该学生吗？');" style="display:inline">
<input type="hidden" name="courseId" th:value="${selectedCourse.courseId}">
<input type="hidden" name="studentId" th:value="${s.id}">
<button class="btn btn-delete" type="submit">退选</button>
</form></td>
</tr>
</tbody>
</table></div>
</div>
</section></div></body></html>

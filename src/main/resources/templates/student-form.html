<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生信息</title>
    <link rel="stylesheet" href="/css/style.css" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-shell">
    <th:block th:replace="~{fragments/sidebar :: sidebar('students')}"></th:block>

    <main class="main">
        <div class="page-head">
            <div>
                <h1 class="page-title">学生信息</h1>
                <p class="page-subtitle">填写或修改学生档案。</p>
            </div>
            <div class="actions">
                <a class="btn btn-secondary" th:href="@{/student/page/list}">返回列表</a>
            </div>
        </div>

        <div class="panel">
            <p th:if="${errorMsg}" th:text="${errorMsg}" class="error"></p>

            <form th:action="@{/student/page/save}" th:method="post" th:object="${student}">
                <div class="form-grid">
                    <div class="form-group">
                        <label>学号</label>
                        <input type="text" th:field="*{studentId}" placeholder="必填">
                    </div>
                    <div class="form-group">
                        <label>姓名</label>
                        <input type="text" th:field="*{name}" placeholder="必填">
                    </div>
                    <div class="form-group">
                        <label>班级</label>
                        <input type="text" th:field="*{className}" placeholder="例如 计科 1 班">
                    </div>
                    <div class="form-group">
                        <label>年龄</label>
                        <input type="number" th:field="*{age}">
                    </div>
                    <div class="form-group">
                        <label>性别</label>
                        <select th:field="*{gender}">
                            <option value="">未选择</option>
                            <option value="男">男</option>
                            <option value="女">女</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>出生日期</label>
                        <input type="date" th:field="*{birthDate}">
                    </div>
                    <div class="form-group full">
                        <label>联系方式</label>
                        <input type="text" th:field="*{phone}" placeholder="11 位手机号">
                    </div>
                </div>

                <div class="btn-row">
                    <button type="submit" class="btn btn-primary">保 存</button>
                    <a class="btn btn-secondary" th:href="@{/student/page/list}">取消</a>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>

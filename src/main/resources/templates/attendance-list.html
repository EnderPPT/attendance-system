<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>考勤记录</title>
    <link rel="stylesheet" href="/css/style.css" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-shell">
    <th:block th:replace="~{fragments/sidebar :: sidebar('attendance')}"></th:block>

    <main class="main">
        <div class="page-head">
            <div>
                <h1 class="page-title">考勤记录</h1>
                <p class="page-subtitle">按课程、日期或状态检索打卡明细。</p>
            </div>
            <div class="stat">
                <strong th:text="${pageData.totalElements}">0</strong>
                <span>匹配条目</span>
            </div>
        </div>

        <div class="panel">
            <form class="filter-row" th:action="@{/attendance/page/list}" method="get">
                <div class="field">
                    <span class="search-icon">⌕</span>
                    <select name="courseId">
                        <option value="">所有课程</option>
                        <option th:each="course : ${courses}" th:value="${course.courseId}"
                                th:selected="${course.courseId == courseId}"
                                th:text="${course.courseCode + ' · ' + course.courseName}"></option>
                    </select>
                </div>
                <div class="field">
                    <span class="search-icon">⌕</span>
                    <select name="status">
                        <option value="">所有状态</option>
                        <option value="NORMAL" th:selected="${status == 'NORMAL'}">正常</option>
                        <option value="LATE" th:selected="${status == 'LATE'}">迟到</option>
                        <option value="EARLY" th:selected="${status == 'EARLY'}">早退</option>
                        <option value="ABSENT" th:selected="${status == 'ABSENT'}">缺勤</option>
                        <option value="LEAVE" th:selected="${status == 'LEAVE'}">请假</option>
                    </select>
                </div>
                <div class="field">
                    <input type="date" name="startTime" th:value="${startTime}" placeholder="起始日期">
                </div>
                <div class="field">
                    <input type="date" name="endTime" th:value="${endTime}" placeholder="结束日期">
                </div>
                <button type="submit" class="btn btn-primary">查询</button>
                <a th:href="@{/attendance/page/list}" class="btn btn-reset">重置</a>
            </form>

            <div class="table-wrap">
                <table>
                    <thead>
                    <tr>
                        <th>编号</th>
                        <th>学号</th>
                        <th>姓名</th>
                        <th>课程</th>
                        <th>打卡时间</th>
                        <th>座位</th>
                        <th>状态</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(pageData.content)}">
                        <td colspan="7" class="empty">无匹配记录。</td>
                    </tr>
                    <tr th:each="record : ${pageData.content}">
                        <td th:text="${record.id}"></td>
                        <td class="student-id" th:text="${userMap[record.studentId] != null ? userMap[record.studentId].username : ('#' + record.studentId)}"></td>
                        <td class="name-cell" th:text="${userMap[record.studentId] != null ? userMap[record.studentId].realName : '-'}"></td>
                        <td th:text="${record.courseId}"></td>
                        <td th:text="${#calendars.format(record.checkInTime, 'yyyy-MM-dd HH:mm')}"></td>
                        <td>
                            <span th:if="${record.status == 'LEAVE'}" style="color:var(--muted);">—</span>
                            <span th:unless="${record.status == 'LEAVE'}"
                                  th:text="${record.seatRow} + ' 排 ' + ${record.seatCol} + ' 列'"></span>
                        </td>
                        <td>
                            <span th:if="${record.status == 'NORMAL'}" class="badge badge-success">正常</span>
                            <span th:if="${record.status == 'LATE'}" class="badge badge-error">迟到</span>
                            <span th:if="${record.status == 'EARLY'}" class="badge badge-error">早退</span>
                            <span th:if="${record.status == 'ABSENT'}" class="badge badge-other">缺勤</span>
                            <span th:if="${record.status == 'LEAVE'}" class="badge" style="color:var(--info); background:var(--info-soft);">请假</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div th:if="${pageData.totalPages > 0}"
                 style="margin-top:14px; display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--muted);">
                <span>
                    第 <strong style="color:var(--text)" th:text="${pageData.number + 1}"></strong> /
                    <span th:text="${pageData.totalPages}"></span> 页 · 共
                    <span th:text="${pageData.totalElements}"></span> 条
                </span>
                <span style="display:flex; gap:6px;">
                    <a th:if="${pageData.hasPrevious()}"
                       th:href="@{/attendance/page/list(page=${pageData.number}, courseId=${courseId}, status=${status}, startTime=${startTime}, endTime=${endTime})}"
                       class="btn btn-secondary btn-small">上一页</a>
                    <span th:unless="${pageData.hasPrevious()}" class="btn btn-secondary btn-small" style="opacity:.4">上一页</span>

                    <a th:if="${pageData.hasNext()}"
                       th:href="@{/attendance/page/list(page=${pageData.number + 2}, courseId=${courseId}, status=${status}, startTime=${startTime}, endTime=${endTime})}"
                       class="btn btn-secondary btn-small">下一页</a>
                    <span th:unless="${pageData.hasNext()}" class="btn btn-secondary btn-small" style="opacity:.4">下一页</span>
                </span>
            </div>
        </div>
    </main>
</div>
</body>
</html>

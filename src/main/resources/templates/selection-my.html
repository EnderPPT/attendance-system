<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>我的课程</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><div class="app-page"><nav class="page-nav"><a class="active" href="/dashboard">首页</a></nav>
<section class="hero-card"><div class="hero-content"><div><div class="eyebrow">📖 MY COURSES</div><h1 class="hero-title">我的课程</h1><p class="hero-desc">这里显示你已选择的课程，可用于打卡或请假。</p></div></div></section>
<section class="panel">
<div class="table-wrap"><table>
<thead><tr><th>课程代码</th><th>课程名称</th><th>班级</th><th>教室</th><th>星期</th><th>操作</th></tr></thead>
<tbody>
<tr th:if="${#lists.isEmpty(courses)}"><td colspan="6" class="empty">尚未选课。请联系老师或管理员安排选课。</td></tr>
<tr th:each="c : ${courses}">
<td th:text="${c.courseCode}"></td><td th:text="${c.courseName}"></td><td th:text="${c.className}"></td><td th:text="${c.classroomName}"></td>
<td th:text="${c.weekday != null ? '周' + c.weekday : '-'}"></td>
<td><a class="btn btn-edit" th:href="@{/attendance/page/checkin(courseId=${c.courseId})}">去打卡</a>
<a class="btn btn-edit" th:href="@{/leave/page/apply(courseId=${c.courseId})}">请假</a></td>
</tr>
</tbody>
</table></div>
</section></div></body></html>

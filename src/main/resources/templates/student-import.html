<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生导入</title>
    <link rel="stylesheet" href="/css/style.css" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-page form-page">
    <nav class="page-nav">
        <a href="/dashboard">首页</a>
        <a href="/student/page/list">学生档案</a>
        <a class="active" href="#">导入</a>
    </nav>

    <section class="hero-card">
        <div class="hero-content">
            <div>
                <div class="eyebrow">№ 102 · Bulk Import</div>
                <h1 class="hero-title">从 Excel 批量导入学生</h1>
                <p class="hero-desc">表头格式：学号、姓名、性别、年龄、出生日期、手机号、班级。导入时系统会同步创建登录账号，初始密码 123456。</p>
            </div>
            <a class="btn btn-secondary" href="/student/page/list">返回列表</a>
        </div>
    </section>

    <section class="panel">
        <p th:if="${error}" class="error" th:text="${error}"></p>
        <p th:if="${success}" class="success" th:text="${success}"></p>

        <form th:action="@{/student/page/import}" method="post" enctype="multipart/form-data">
            <div class="form-grid">
                <div class="form-group full">
                    <label>选择文件</label>
                    <input type="file" name="file" accept=".xlsx,.xls" required>
                    <small style="color:var(--muted); font-size:12px; margin-top:6px;">支持 xlsx / xls，单文件不超过 10MB。</small>
                </div>
            </div>
            <div class="btn-row">
                <button type="submit" class="btn btn-primary"
                        onclick="this.innerText='解析中…'; this.disabled=false;">上传并解析</button>
            </div>
        </form>
    </section>
</div>
</body>
</html>

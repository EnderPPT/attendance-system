<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生导入</title>
    <link rel="stylesheet" href="/css/style.css" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-shell">
    <th:block th:replace="~{fragments/sidebar :: sidebar('student-import')}"></th:block>

    <main class="main">
        <div class="page-head">
            <div>
                <h1 class="page-title">学生导入</h1>
                <p class="page-subtitle">从 Excel 批量导入学生，导入时同步创建登录账号（初始密码 123456）。</p>
            </div>
            <div class="actions">
                <a class="btn btn-secondary" href="/student/page/list">返回列表</a>
            </div>
        </div>

        <div class="panel">
            <p th:if="${error}" class="error" th:text="${error}"></p>
            <p th:if="${success}" class="success" th:text="${success}"></p>

            <form th:action="@{/student/page/import}" method="post" enctype="multipart/form-data">
                <div class="form-grid">
                    <div class="form-group full">
                        <label>选择文件 <small>表头：学号、姓名、性别、年龄、出生日期、手机号、班级</small></label>
                        <input type="file" name="file" accept=".xlsx,.xls" required>
                        <small style="color:var(--muted); font-size:12px; margin-top:6px; display:block;">支持 xlsx / xls，单文件不超过 10MB。</small>
                    </div>
                </div>
                <div class="btn-row">
                    <button type="submit" class="btn btn-primary"
                            onclick="this.innerText='解析中…'; this.disabled=false;">上传并解析</button>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>

spring.application.name=attendance-system
server.port=${SERVER_PORT:8085}

# PostgreSQL connection. Override these values with environment variables in production.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/attendance_system}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

file.upload.path=${UPLOAD_PATH:${java.io.tmpdir}/attendance-system/}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
